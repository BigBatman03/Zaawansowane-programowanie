name: PEP 8

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  pycodestyle:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install pycodestyle
        run: python -m pip install --upgrade pycodestyle

      - name: Check PEP 8 compliance
        run: pycodestyle .
